name: Parallel Scraper Instances 

on:
workflow_dispatch:
inputs:
start_page:
description: 'START_PAGE'
required: true
default: '1'
end_page:
description: 'END_PAGE'
required: true
default: '100' 

jobs:
run-scraper:
runs-on: ubuntu-latest
steps:
- name: Checkout repository code
uses: actions/checkout@v4 

* name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
* name: Install dependencies
run: |
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
* name: Run Scraper Instance
env:
START_PAGE: ${{ github.event.inputs.start_page }}
END_PAGE: ${{ github.event.inputs.end_page }}
run: |
python your_scraper_file.py
* name: Save Results
if: always()
uses: actions/upload-artifact@v4
with:
name: data-from-page-

